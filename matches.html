<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All IPL Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero topbar">
      <div>
        <p class="kicker">IPL Full Schedule</p>
        <h1>All Matches</h1>
        <p class="subtitle">Filter by tag, search by text, and team-wise search.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-ghost" href="index.html">Back To Main</a>
      </div>
    </header>

    <section class="panel section-panel">
      <div class="section-head">
        <h2>Your Team Points</h2>
        <span class="pill pill-upcoming">Scoring</span>
      </div>
      <div id="pointsTable" class="points-grid"></div>
    </section>

    <section class="panel section-panel">
      <div class="filter-grid">
        <input id="searchInput" class="text-input" type="text" placeholder="Search city, stage, team, ID..." />
        <select id="teamFilter" class="text-input">
          <option value="">All Teams</option>
        </select>
        <select id="tagFilter" class="text-input">
          <option value="today-upcoming" selected>Today + Upcoming</option>
          <option value="all">All Tags</option>
          <option value="today">Today</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Completed</option>
        </select>
      </div>
    </section>

    <section class="panel section-panel">
      <div class="section-head">
        <h2 id="resultsHeading">Matches</h2>
        <div class="page-actions">
          <button id="syncResultsBtn" class="btn btn-ghost" type="button">Sync Results</button>
        </div>
      </div>
      <p id="syncStatus" class="history-note" hidden></p>
      <div id="allMatches" class="cards-grid"></div>
      <p id="allEmpty" class="history-empty" hidden>No matches found for this filter.</p>
    </section>
  </main>

  <script src="matches.js"></script>
</body>
</html>

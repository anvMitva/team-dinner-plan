<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matchup Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-shape bg-shape-a" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-b" aria-hidden="true"></div>

  <main class="app-shell">
    <header class="hero topbar">
      <div>
        <p class="kicker">Matchup Viewer</p>
        <h1 id="detailsHeading">Team Details</h1>
        <p class="subtitle" id="detailsSub">Loading selected matchup...</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-primary" id="updateTeamLink" href="add-team.html">Update Team</a>
        <a class="btn btn-ghost" href="index.html">Back To Landing</a>
      </div>
    </header>

    <section class="results" id="detailsResults" hidden>
      <article class="panel team-card" id="detailTeamA">
        <h2 class="team-title"></h2>
        <ul class="team-list"></ul>
      </article>

      <article class="panel team-card" id="detailTeamB">
        <h2 class="team-title"></h2>
        <ul class="team-list"></ul>
      </article>
    </section>

    <section class="panel history-panel">
      <p id="detailsStatus" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="detail.js"></script>
</body>
</html>
